<meta charset="utf-8">
<title>Điền từ Thời kỳ quá độ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: sân khấu gameshow một cột — hero căn giữa với tiêu đề vàng phát sáng, khung trò chơi kính mờ, màn chiến thắng phủ toàn màn. Nền xanh đêm, nhấn vàng ánh kim + xanh ngọc. Một giao diện tối cố định. */
:root{
  --bg:#081028; --bg-2:#0f1a44; --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.1); --stroke:rgba(255,255,255,.13);
  --text:#f3f5ff; --muted:#a3add3; --gold:#ffcb52; --gold-2:#ffa62b; --gold-ink:#2a1a00; --teal:#3ee0c8;
  --ok:#2fd38a; --ok-2:#18a96a; --no:#ff8c42; --given:#7f8bb8;
  --display:"Montserrat","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100%;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;background-color:var(--bg);
  background-image:radial-gradient(900px 600px at 12% -5%,rgba(62,224,200,.18),transparent 60%),radial-gradient(900px 700px at 95% 5%,rgba(110,90,255,.22),transparent 60%),radial-gradient(1000px 600px at 50% 110%,rgba(255,203,82,.14),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1.2px 1.2px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.4px 1.4px at 55% 35%,#fff,transparent),radial-gradient(1px 1px at 75% 80%,#fff,transparent),radial-gradient(1.2px 1.2px at 88% 25%,#fff,transparent),radial-gradient(1px 1px at 20% 90%,#fff,transparent),radial-gradient(1px 1px at 65% 10%,#fff,transparent);
  background-size:520px 520px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.6}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

/* Hero */
.hero{position:relative;overflow:hidden;padding-block:clamp(48px,9vh,100px) clamp(30px,6vh,60px)}
.hero .wrap>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.hero::before{content:"";position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,rgba(255,203,82,.16),transparent 30%,rgba(62,224,200,.14),transparent 60%,rgba(255,203,82,.12),transparent);filter:blur(30px);animation:spin 24s linear infinite;z-index:0;-webkit-mask:radial-gradient(circle,#000 25%,transparent 62%);mask:radial-gradient(circle,#000 25%,transparent 62%)}
.hero .wrap{z-index:1}
.hero-star{width:clamp(64px,8vw,96px);height:auto;filter:drop-shadow(0 0 22px rgba(255,203,82,.75));animation:starIn 1s cubic-bezier(.2,1.4,.4,1) both,float 4s ease-in-out 1s infinite}
.hero-star path{fill:url(#none);fill:var(--gold)}
.hero h1{margin:0;font:900 clamp(34px,6vw,76px)/1.05 var(--display);letter-spacing:-.02em;max-width:14em;text-wrap:balance;
  background:linear-gradient(180deg,#fff 0%,#fff 45%,#cfd6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:dropIn .8s .15s cubic-bezier(.2,1.2,.4,1) both}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold),#fff3c4,var(--gold-2),var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sheen 5s linear infinite;filter:drop-shadow(0 0 18px rgba(255,203,82,.45))}
.ribbon{font:600 14px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:10px 18px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass);backdrop-filter:blur(8px);animation:dropIn .6s .45s ease-out both}
.cta-row{display:flex;justify-content:center;margin-top:10px;animation:dropIn .6s .65s ease-out both}
.cta{font:800 clamp(18px,1.8vw,22px)/1 var(--display);letter-spacing:.02em;padding:20px 44px;border-radius:999px;border:0;cursor:pointer;color:var(--gold-ink);
  background:linear-gradient(180deg,#ffe08a,var(--gold) 45%,var(--gold-2));box-shadow:0 0 0 6px rgba(255,203,82,.15),0 14px 40px -8px rgba(255,166,43,.7);animation:pulse 1.8s 1.4s ease-in-out infinite}
.cta:hover{filter:brightness(1.08)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(10deg)}}
@keyframes starIn{from{transform:scale(0) rotate(-200deg);opacity:0}to{transform:none;opacity:1}}
@keyframes dropIn{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheen{to{background-position:-300% 0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(255,203,82,.15),0 14px 40px -8px rgba(255,166,43,.7)}50%{box-shadow:0 0 0 14px rgba(255,203,82,.05),0 14px 50px -6px rgba(255,166,43,.9)}}

/* Section */
section.block{position:relative;z-index:1;padding-block:8px clamp(40px,8vh,80px)}
.shead{margin-bottom:18px}
.shead h2{display:flex;align-items:center;gap:12px;margin:0;font:800 clamp(22px,2.6vw,30px)/1.2 var(--display);letter-spacing:-.01em}
.deco-star{width:26px;height:26px;filter:drop-shadow(0 0 8px rgba(255,203,82,.7))}
.deco-star path{fill:var(--gold)}

/* Game */
.game{position:relative;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--stroke);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.game::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,203,82,.7),transparent 35%,transparent 65%,rgba(62,224,200,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:16px clamp(18px,3vw,32px);border-bottom:1px solid var(--stroke);background:rgba(8,16,40,.35)}
.progress{flex:1 1 240px;display:flex;align-items:center;gap:14px;min-width:0}
.ptrack{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;display:flex;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.ptrack i{display:block;height:100%;transition:width .5s cubic-bezier(.2,1,.3,1)}
.ptrack .pok{background:linear-gradient(90deg,var(--ok-2),var(--ok) 40%,#9ff5c9 50%,var(--ok) 60%,var(--ok-2));background-size:200% 100%;animation:shim 1.6s linear infinite;box-shadow:0 0 12px rgba(47,211,138,.7)}
.ptrack .pgv{background:var(--given)}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.plabel{font:800 18px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font:600 14px/1 var(--body);padding:9px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);display:inline-flex;gap:8px;align-items:center;color:var(--muted)}
.pill b{font:800 16px/1 var(--display);color:var(--no);font-variant-numeric:tabular-nums}
.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.clock{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:82px;text-align:center;padding:8px 12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--stroke);color:var(--gold);text-shadow:0 0 14px rgba(255,203,82,.6)}
.clock.low{color:var(--no);text-shadow:0 0 14px rgba(255,140,66,.7)}
.tbtn{font:600 14px/1 var(--body);padding:11px 14px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);color:var(--text);cursor:pointer;transition:background .15s}
.tbtn:hover{background:var(--glass-2)}
.snd[aria-pressed="false"]{opacity:.45}

.passage{padding:clamp(22px,3.6vw,46px) clamp(18px,3.6vw,46px) 6px;font-size:clamp(18px,1.95vw,25px);line-height:2.2;font-weight:500;color:#e6eaff;text-wrap:pretty}
.passage p{margin:0}
.blank{display:inline-flex;align-items:center;gap:8px;vertical-align:middle;cursor:pointer;font:inherit;line-height:1.3;color:var(--muted);
  background:rgba(0,0,0,.28);border:2px dashed rgba(62,224,200,.45);padding:4px 14px 4px 6px;border-radius:12px;margin:2px 0;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s}
.blank:not(.open){width:8.5em;justify-content:flex-start}
.blank:not(.open) .a{display:none}
.blank .n{font:800 .66em/1 var(--display);color:var(--gold-ink);background:linear-gradient(180deg,#ffe08a,var(--gold));border-radius:50%;width:1.6em;height:1.6em;display:inline-grid;place-items:center;flex:none}
.armed .blank:not(.open){border-color:var(--gold);background:rgba(255,203,82,.08);box-shadow:0 0 18px -4px rgba(255,203,82,.6)}
.blank.over{background:rgba(255,203,82,.2)!important;transform:scale(1.05);box-shadow:0 0 26px rgba(255,203,82,.7)!important}
.blank.open{cursor:default;border-style:solid;font-weight:700;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.blank.ok{background:linear-gradient(180deg,#43e39b,var(--ok-2));border-color:#7ff0bb;color:#04210f;animation:pop .4s cubic-bezier(.2,1.5,.4,1),glow 1.3s ease-out}
.blank.ok .n{background:#04210f;color:#7ff0bb}
.blank.gv{background:rgba(127,139,184,.25);border-color:var(--given);color:#e6eaff}
.blank.gv .n{background:var(--given);color:#0b1230}
.blank.bad{border-color:var(--no);border-style:solid;box-shadow:0 0 22px rgba(255,140,66,.7);animation:shake .4s}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(47,211,138,.9)}100%{box-shadow:0 0 0 22px rgba(47,211,138,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.msg{min-height:30px;margin:10px clamp(18px,3.6vw,46px);font:700 18px/1.4 var(--display);text-align:center}
.msg .ok{color:var(--ok);text-shadow:0 0 14px rgba(47,211,138,.5)} .msg .no{color:var(--no)}

.bankarea{margin:10px clamp(12px,2vw,22px) 0;padding:20px clamp(14px,2.4vw,26px);border-radius:22px;background:rgba(0,0,0,.22);border:1px solid var(--stroke);display:flex;flex-direction:column;gap:14px}
.lab{font:700 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.bank{display:flex;flex-wrap:wrap;gap:10px;min-height:52px}
.chip{font:700 clamp(15px,1.55vw,19px)/1.2 var(--body);padding:13px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));color:var(--text);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 8px 20px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,border-color .15s,box-shadow .15s;
  animation:chipIn .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--d,0) * 70ms)}
.chip:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 10px 26px -8px rgba(255,203,82,.55),inset 0 1px 0 rgba(255,255,255,.2)}
.chip.sel{background:linear-gradient(180deg,#ffe08a,var(--gold) 50%,var(--gold-2));color:var(--gold-ink);border-color:#fff2c2;box-shadow:0 0 24px rgba(255,203,82,.7);animation:wiggle .5s ease-in-out infinite}
.chip.lift{opacity:.25}
.chip.used{display:none}
.drag{position:fixed;left:0;top:0;z-index:80;pointer-events:none;cursor:grabbing;animation:none!important;background:linear-gradient(180deg,#ffe08a,var(--gold) 50%,var(--gold-2));color:var(--gold-ink);box-shadow:0 22px 40px -10px rgba(0,0,0,.7),0 0 30px rgba(255,203,82,.6);transition:none}
.empty{color:var(--muted);font-size:15px;align-self:center}
@keyframes chipIn{from{transform:translateY(26px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-2px)}}

.banner{margin:16px clamp(12px,2vw,22px) 0;border-radius:18px;padding:16px 20px;background:rgba(47,211,138,.12);border:1px solid rgba(47,211,138,.4);display:flex;gap:14px;align-items:center;font:700 clamp(16px,1.7vw,20px)/1.35 var(--display)}
.banner .ico{width:38px;height:38px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none;color:#04210f}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:20px clamp(18px,3vw,32px) 26px}
.btn{font:700 15px/1 var(--body);padding:14px 22px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass);color:var(--text);cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--glass-2);transform:translateY(-1px)}
.btn.main{border:0;color:var(--gold-ink);background:linear-gradient(180deg,#ffe08a,var(--gold) 45%,var(--gold-2));box-shadow:0 10px 26px -10px rgba(255,166,43,.8)}

/* VFX */
.game.shake{animation:gshake .45s}
@keyframes gshake{0%,100%{transform:none}20%{transform:translate(-10px,2px) rotate(-.4deg)}40%{transform:translate(9px,-2px) rotate(.4deg)}60%{transform:translate(-6px,1px)}80%{transform:translate(5px,0)}}
body.urgent .clock{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;box-shadow:inset 0 0 140px 40px rgba(255,140,66,.5)}
body.urgent .vignette{animation:vig 1s ease-in-out infinite}
@keyframes vig{0%,100%{opacity:.15}15%{opacity:.9}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.floater{position:fixed;z-index:75;pointer-events:none;font:900 clamp(24px,2.8vw,36px)/1 var(--display);color:var(--gold);text-shadow:0 0 18px rgba(255,203,82,.9),0 2px 0 #7a4b00;transform:translate(-50%,-50%);animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
.floater.big{font-size:clamp(44px,7vw,92px);letter-spacing:-.02em;background:linear-gradient(180deg,#fff,var(--gold) 55%,var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 24px rgba(255,203,82,.8));animation:comboPop 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}
@keyframes comboPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-10deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}}

/* Win */
.win{position:fixed;inset:0;z-index:65;display:grid;place-items:center;background:rgba(4,8,24,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:16px;animation:fadeIn .35s ease-out}
.wincard{position:relative;overflow:hidden;isolation:isolate;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:min(620px,100%);
  padding:clamp(30px,5vw,56px) clamp(22px,5vw,60px);border-radius:32px;background:linear-gradient(180deg,#15225a,#0b1433);border:1px solid rgba(255,203,82,.5);
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 40px 100px -20px rgba(0,0,0,.9),0 0 80px -10px rgba(255,203,82,.35);animation:cardIn .6s cubic-bezier(.2,1.3,.4,1) both}
.winrays{position:absolute;left:50%;top:30%;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:-1;background:repeating-conic-gradient(rgba(255,203,82,.12) 0deg 6deg,transparent 6deg 15deg);animation:spin 22s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 60%);mask:radial-gradient(circle,#000 20%,transparent 60%)}
.winstar{width:110px;height:auto;filter:drop-shadow(0 0 28px rgba(255,203,82,.9));animation:starIn .9s .2s cubic-bezier(.2,1.4,.4,1) both,float 3.5s ease-in-out 1.1s infinite}
.winstar path{fill:var(--gold)}
.wintitle{font:900 clamp(42px,7vw,80px)/1 var(--display);letter-spacing:-.02em;background:linear-gradient(180deg,#fff,var(--gold) 55%,var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:dropIn .6s .35s ease-out both}
.winsub{font:600 clamp(16px,1.8vw,20px)/1.4 var(--body);color:var(--muted);animation:dropIn .6s .5s ease-out both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{transform:scale(.5) translateY(30px);opacity:0}to{transform:none;opacity:1}}


/* ===== Menu ===== */
section.block{padding-top:clamp(20px,4vh,40px)}
.menu{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(800px 500px at 50% 30%,rgba(255,203,82,.12),transparent 70%),rgba(6,11,30,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fadeIn .4s ease-out}
.menucard{position:relative;isolation:isolate;overflow:hidden;width:min(680px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;
  padding:clamp(28px,5vw,52px) clamp(20px,5vw,52px);border-radius:32px;background:linear-gradient(180deg,rgba(23,36,92,.92),rgba(9,16,44,.95));border:1px solid rgba(255,203,82,.45);
  box-shadow:0 40px 100px -20px rgba(0,0,0,.9),0 0 90px -20px rgba(255,203,82,.35);animation:cardIn .6s cubic-bezier(.2,1.3,.4,1) both}
.menurays{position:absolute;left:50%;top:18%;width:1000px;height:1000px;margin:-500px 0 0 -500px;z-index:-1;background:repeating-conic-gradient(rgba(255,203,82,.1) 0deg 6deg,transparent 6deg 15deg);animation:spin 30s linear infinite;-webkit-mask:radial-gradient(circle,#000 15%,transparent 55%);mask:radial-gradient(circle,#000 15%,transparent 55%)}
.menucard .hero-star path{fill:var(--gold)}
.mtitle{margin:0;font:900 clamp(30px,5vw,52px)/1.08 var(--display);letter-spacing:-.02em;text-wrap:balance;background:linear-gradient(180deg,#fff,#cfd6ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:dropIn .7s .15s cubic-bezier(.2,1.2,.4,1) both}
.mtitle em{font-style:normal;background:linear-gradient(90deg,var(--gold),#fff3c4,var(--gold-2),var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s linear infinite;filter:drop-shadow(0 0 16px rgba(255,203,82,.45))}
.mopts{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:4px;animation:dropIn .6s .5s ease-out both}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px 12px 18px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
.mlab{font:700 16px/1.2 var(--display);text-align:left}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.3)}
.seg button{font:700 14px/1 var(--body);padding:10px 14px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-checked="true"]{background:linear-gradient(180deg,#ffe08a,var(--gold) 50%,var(--gold-2));color:var(--gold-ink);box-shadow:0 4px 14px -4px rgba(255,166,43,.8)}
.tog{display:inline-flex;align-items:center;gap:10px;font:700 14px/1 var(--body);color:var(--text);background:transparent;border:0;cursor:pointer;padding:4px}
.tog i{position:relative;width:48px;height:28px;border-radius:99px;background:rgba(255,255,255,.15);transition:background .2s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tog[aria-pressed="true"] i{background:var(--ok)}
.tog[aria-pressed="true"] i::after{transform:translateX(20px)}
.tog span{min-width:28px;text-align:left}

<script>
const A = [
  "đa dạng",
  "đan xen",
  "cơ cấu xã hội – nghề nghiệp",
  "vừa đấu tranh, vừa liên minh",
  "công nhân – nông dân – trí thức",
  "công nhân – nông dân",
  "công nghiệp hóa, hiện đại hóa",
  "hội nhập kinh tế",
  "bất bình đẳng xã hội"
];
const TEXT = [
  "Trong thời kỳ quá độ lên chủ nghĩa xã hội, cơ cấu xã hội – giai cấp mang tính {0} và phức tạp, vì các yếu tố xã hội cũ và mới tồn tại {1} với nhau. ",
  "Bên cạnh đó còn có {2}, cách phân chia con người theo công việc mà họ đảm nhiệm. ",
  "Quan hệ giữa các giai cấp, tầng lớp mang hai tính chất: {3}. ",
  "Nòng cốt của liên minh giai cấp, tầng lớp là {4}, trong đó hai giai cấp cơ bản là {5}. ",
  "Cơ cấu xã hội biến đổi gắn với quá trình {6} và xu thế {7}; nếu thiếu chính sách phù hợp, sự biến đổi này có thể làm gia tăng {8}."
].join("");
const ORDER = [6,0,4,8,2,7,1,5,3];
let TIME = 240;
const TIP = '';
const $ = id => document.getElementById(id);
let filled = new Map(), wrong = 0, sel = null, left = TIME, ticking = null;


/* ===== Âm thanh (tạo bằng Web Audio, nhạc tự soạn) ===== */
const Snd=(()=>{
  let ac=null,master,mus,fx,noiseBuf=null,musicOn=true,sfxOn=true;
  let bpm=128,step=0,nextT=0,iv=null,playing=false;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return false; }
      master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
      mus=ac.createGain(); mus.gain.value=.15; mus.connect(master);
      fx=ac.createGain(); fx.gain.value=.5; fx.connect(master); }
    if(ac.state==="suspended") ac.resume().catch(()=>{});
    return true;
  }
  function tone(f,t,d,type,g,dest,slide){
    const o=ac.createOscillator(),v=ac.createGain(); o.type=type||"square";
    o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g,t+.008); v.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(v); v.connect(dest||fx); o.start(t); o.stop(t+d+.03);
  }
  function noise(t,d,g,dest,hp){
    if(!noiseBuf){ noiseBuf=ac.createBuffer(1,ac.sampleRate*.5|0,ac.sampleRate); const c=noiseBuf.getChannelData(0); for(let i=0;i<c.length;i++) c[i]=Math.random()*2-1; }
    const s=ac.createBufferSource(); s.buffer=noiseBuf; const f=ac.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    const v=ac.createGain(); v.gain.setValueAtTime(g,t); v.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f); f.connect(v); v.connect(dest||fx); s.start(t); s.stop(t+d+.03);
  }
  // Nhạc nền hành khúc vui (giai điệu tự soạn)
  const L1=[72,0,76,79,77,76,74,0, 72,74,76,72,79,0,77,76, 74,0,77,81,79,77,76,74, 72,76,74,71,72,0,79,0];
  const L2=[79,0,76,79,81,79,77,0, 76,77,79,76,74,0,72,74, 76,0,79,84,83,81,79,77, 76,79,77,74,72,0,0,0];
  const ROOT=[48,53,55,48];
  function playStep(s,t){
    const e=60/bpm/2, bar=Math.floor((s%32)/8), n=(s<32?L1:L2)[s%32];
    if(n) tone(mf(n),t,e*.85,"square",.2,mus);
    if(s%2===0){ const r=ROOT[bar]; tone(mf(s%4===0?r:r+7),t,e*1.7,"triangle",.55,mus); }
    noise(t,.03,s%2?.14:.07,mus,7000);
    if(s%8===2||s%8===6) noise(t,.13,.32,mus,1600);
    if(s%8===0||s%8===4) tone(150,t,.14,"sine",.9,mus,42);
  }
  function sched(){ while(nextT<ac.currentTime+.12){ playStep(step,nextT); nextT+=60/bpm/2; step=(step+1)%64; } }
  function play(){ if(!musicOn||playing||!ensure()) return; playing=true; nextT=ac.currentTime+.06; iv=setInterval(sched,25); }
  function pause(){ playing=false; clearInterval(iv); }
  const S=(fn)=>(...a)=>{ if(!sfxOn||!ensure()) return; fn(ac.currentTime+.01,...a); };
  return {
    ensure, play, pause,
    setBpm(b){ bpm=b; },
    toggleMusic(){ musicOn=!musicOn; if(!musicOn) pause(); return musicOn; },
    toggleSfx(){ sfxOn=!sfxOn; return sfxOn; },
    get musicOn(){ return musicOn; }, get sfxOn(){ return sfxOn; },
    pick:S(t=>{ tone(880,t,.06,"triangle",.4); tone(1320,t+.03,.05,"triangle",.25); }),
    correct:S((t,c=1)=>{ const up=Math.min(c-1,5)*2; [72,76,79,84].forEach((m,k)=>tone(mf(m+up),t+k*.065,.16,"square",.22)); tone(mf(96+up),t+.26,.35,"sine",.18); }),
    wrong:S(t=>{ tone(220,t,.18,"sawtooth",.28,fx,140); tone(196,t+.13,.26,"sawtooth",.28,fx,98); }),
    chime:S(t=>{ tone(1318,t,.25,"sine",.3); tone(1760,t+.06,.3,"sine",.2); }),
    tick:S(t=>{ tone(1600,t,.05,"square",.18); }),
    timeup:S(t=>{ [67,63,60,55].forEach((m,k)=>tone(mf(m),t+k*.2,.3,"sawtooth",.25)); }),
    win:S(t=>{ const seq=[[60,.12],[64,.12],[67,.12],[72,.3],[67,.12],[72,.5]]; let x=t; seq.forEach(([m,d])=>{ tone(mf(m),x,d+.05,"square",.25); tone(mf(m-12),x,d+.05,"triangle",.4); x+=d; });
      [72,76,79,84].forEach(m=>tone(mf(m),x,1.2,"square",.12)); for(let k=0;k<6;k++) noise(x+k*.18,.25,.2,fx,3000); })
  };
})();

/* ===== Hiệu ứng hạt ===== */
const FX=(()=>{
  const cv=document.getElementById("fx"), ctx=cv.getContext("2d"); let P=[],raf=null,dpr=1;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COLORS=["#ffcb52","#ffffff","#3ee0c8","#ffa62b","#2fd38a"];
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; }
  size(); addEventListener("resize",size);
  function star(x,y,r){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2, rr=i%2?r*.45:r; ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} ctx.closePath(); ctx.fill(); }
  function loop(){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
    P=P.filter(p=>p.life>0);
    for(const p of P){ p.vy+=p.g; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;
      ctx.save(); ctx.globalAlpha=Math.min(1,p.life/30); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      if(p.shape==="star") star(0,0,p.s); else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }
    raf=P.length?requestAnimationFrame(loop):null;
  }
  function add(p){ P.push(p); if(!raf) raf=requestAnimationFrame(loop); }
  function burst(x,y,n=34,power=9,colors=COLORS){
    if(reduce) n=Math.min(n,8);
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=power*(.35+Math.random()*.75);
      add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.28,rot:Math.random()*6,vr:(Math.random()-.5)*.4,s:6+Math.random()*9,
        c:colors[i%colors.length],shape:Math.random()<.45?"star":"rect",life:55+Math.random()*35}); }
  }
  function rain(ms=3500){
    if(reduce) return; const end=performance.now()+ms;
    (function drop(){ for(let i=0;i<7;i++) add({x:Math.random()*innerWidth,y:-20,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,g:.06,rot:Math.random()*6,vr:(Math.random()-.5)*.3,
      s:8+Math.random()*10,c:COLORS[(Math.random()*4)|0],shape:Math.random()<.4?"star":"rect",life:220});
      if(performance.now()<end) setTimeout(drop,60); })();
  }
  function fireworks(k=6){ for(let i=0;i<k;i++) setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4),46,11),i*320); }
  function text(x,y,t,big){ const d=document.createElement("div"); d.className="floater"+(big?" big":""); d.textContent=t; d.style.left=x+"px"; d.style.top=y+"px";
    document.body.append(d); setTimeout(()=>d.remove(),1400); }
  return {burst,rain,fireworks,text};
})();
function centerOf(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
let combo=0;

function say(html){ $("msg").innerHTML = html; }

function build(){
  const p = document.createElement("p");
  TEXT.split(/(\{\d\})/).forEach(part=>{
    const m = part.match(/^\{(\d)\}$/);
    if(!m){ p.append(part); return; }
    const i = +m[1];
    const b = document.createElement("button");
    b.type="button"; b.className="blank"; b.id="b"+i; b.dataset.i=i;
    b.setAttribute("aria-label","Chỗ trống "+(i+1));
    b.innerHTML = `<span class="n">${i+1}</span><span class="a"></span>`;
    b.onclick = () => { if(sel!==null) place(sel,i);  };
    p.append(b);
  });
  $("passage").innerHTML=""; $("passage").append(p);
  const bank=$("bank"); bank.innerHTML=""; let bankIdx=0;
  ORDER.forEach(w=>{
    const c=document.createElement("span");
    c.className="chip"; c.style.setProperty("--d",bankIdx++); c.id="c"+w; c.dataset.w=w; c.textContent=A[w];
    c.tabIndex=0; c.setAttribute("role","button");
    c.addEventListener("pointerdown", e=>startDrag(e,c));
    c.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleSel(w); } });
    bank.append(c);
  });
  const empty=document.createElement("span"); empty.className="empty"; empty.id="empty"; empty.hidden=true; empty.textContent="Đã dùng hết các từ.";
  bank.append(empty);
  say(TIP); updateProgress();
}

function toggleSel(w){
  if(sel===w){ clearSel(); say(TIP); return; }
  Snd.pick(); clearSel(); sel=w; $("c"+w).classList.add("sel"); document.body.classList.add("armed");
  say(TIP);
}
function clearSel(){ if(sel!==null){ const c=$("c"+sel); if(c) c.classList.remove("sel"); } sel=null; document.body.classList.remove("armed"); }

function place(w,i){
  const b=$("b"+i);
  if(filled.has(i)){ return; }
  clearSel();
  if(w===i){
    Snd.correct(1);
    const [x,y]=centerOf(b); FX.burst(x,y,42,9);
    fill(i,"ok"); if(filled.size<A.length) say(`<span class="ok">Chính xác! Chỗ ${i+1}: ${A[i]}</span>`); }
  else{
    wrong++; combo=0; $("nno").textContent=wrong; Snd.wrong();
    const g=document.querySelector(".game"); g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake"); setTimeout(()=>g.classList.remove("shake"),500);
    b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad");
    setTimeout(()=>b.classList.remove("bad"),450);
    say(`<span class="no">Chưa đúng: “${A[w]}” không thuộc chỗ ${i+1}. Thử lại!</span>`);
  }
}
function fill(i,kind){
  if(filled.has(i)) return;
  filled.set(i,kind);
  const b=$("b"+i); b.querySelector(".a").textContent=A[i]; b.classList.add("open",kind);
  b.setAttribute("aria-label",`Chỗ trống ${i+1}: ${A[i]}`);
  $("c"+i).classList.add("used");
  if(kind==="gv"){ Snd.chime(); const [x,y]=centerOf(b); FX.burst(x,y,14,5,["#a3add3","#ffcb52","#ffffff"]); }
  if(sel===i) clearSel();
  updateProgress();
  if(filled.size===A.length) finish();
}
function buildSlots(){ const el=$("slots"); if(el.childElementCount) return;
  for(let k=0;k<9;k++){ el.insertAdjacentHTML("beforeend",'<svg class="slot" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.3 6.9.5-5.3 4.4 1.7 6.7L12 16.8l-5.9 3.6 1.7-6.7L2.5 9.3l6.9-.5z"/></svg>'); } }
function updateProgress(){
  buildSlots(); { const ok=[...filled.values()].filter(v=>v==="ok").length, gv=filled.size-ok;
    [...$("slots").children].forEach((sv,k)=>{ sv.classList.toggle("on",k<ok); sv.classList.toggle("gv",k>=ok&&k<ok+gv); }); }
  const ok=[...filled.values()].filter(v=>v==="ok").length, gv=filled.size-ok;
  $("nok").textContent=ok;
  $("pok").style.width=(ok/9*100)+"%"; $("pgv").style.width=(gv/9*100)+"%";
  const e=$("empty"); if(e) e.hidden = filled.size<A.length;
}
function finish(){
  stop();
  const ok=[...filled.values()].filter(v=>v==="ok").length;

  $("bannerText").textContent = ok===9 ? `Hoàn thành! Lớp điền đúng cả 9 chỗ trống${wrong?`, sai ${wrong} lần`:""}.` : `Đã hiện đủ 9 đáp án. Lớp tự điền đúng ${ok}/9 chỗ.`;
  say(""); document.body.classList.remove("urgent");
  setTimeout(()=>{
    $("wintitle").textContent = "Hoàn thành!";
    $("winsub").textContent = "Đoạn văn đã đầy đủ 9 từ khóa.";
    $("win").hidden=false; Snd.win(); FX.fireworks(ok>=5?7:3); if(ok>=5) FX.rain(4000);
  }, 450);
}

/* Kéo thả bằng chuột hoặc cảm ứng */
let drag=null;
function startDrag(e,c){
  if(e.button>0) return;
  const w=+c.dataset.w, r=c.getBoundingClientRect();
  drag={w,c,x0:e.clientX,y0:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,ghost:null,over:null};
  document.addEventListener("pointermove",moveDrag);
  document.addEventListener("pointerup",endDrag);
  document.addEventListener("pointercancel",cancelDrag);
}
function moveDrag(e){
  if(!drag) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6) return;
    const g=drag.c.cloneNode(true); g.removeAttribute("id"); g.className="chip drag"; g.style.width=drag.c.offsetWidth+"px";
    Snd.pick(); document.body.append(g); drag.ghost=g; drag.c.classList.add("lift");
    clearSel(); document.body.classList.add("armed");
  }
  drag.ghost.style.transform=`translate(${e.clientX-drag.dx}px,${e.clientY-drag.dy}px) rotate(-2deg)`;
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const b=t&&t.closest?t.closest(".blank:not(.open)"):null;
  if(drag.over&&drag.over!==b) drag.over.classList.remove("over");
  if(b) b.classList.add("over");
  drag.over=b;
}
function endDrag(){
  if(!drag) return;
  const d=drag; cleanup();
  if(!d.ghost){ toggleSel(d.w); return; }
  document.body.classList.remove("armed");
  if(d.over) place(d.w,+d.over.dataset.i); else say(TIP);
}
function cancelDrag(){ cleanup(); document.body.classList.remove("armed"); }
function cleanup(){
  document.removeEventListener("pointermove",moveDrag);
  document.removeEventListener("pointerup",endDrag);
  document.removeEventListener("pointercancel",cancelDrag);
  if(drag){ if(drag.ghost) drag.ghost.remove(); if(drag.over) drag.over.classList.remove("over"); drag.c.classList.remove("lift"); }
  drag=null;
}

/* Đồng hồ */
function fmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function paint(){ $("clock").textContent=fmt(left); $("cbar").style.width=(left/TIME*100)+"%"; $("cbar").classList.toggle("low",left<=30); $("clock").classList.toggle("low",left<=30); }
function tempo(){ Snd.setBpm(left<=10?160:left<=30?146:128); document.body.classList.toggle("urgent",ticking&&left<=10&&left>0); }
function start(){ if(ticking||filled.size===A.length) return;
  Snd.ensure(); Snd.setBpm(128); Snd.play(); ticking=1; }
function stop(){ clearInterval(ticking); ticking=null; Snd.pause(); document.body.classList.remove("urgent"); if(left>0) $("tbtn").textContent="Bắt đầu"; }
function resetTimer(){ stop(); left=TIME; $("tbtn").textContent="Bắt đầu"; paint(); tempo(); }

$("tbtn").onclick=()=> ticking?stop():start();
$("treset").onclick=resetTimer;
$("bmusic").onclick=()=>{ Snd.ensure(); const on=Snd.toggleMusic(); syncSound(); if(on&&ticking) Snd.play(); };
$("bsfx").onclick=()=>{ const on=Snd.toggleSfx(); syncSound(); };
$("winclose").onclick=()=>{ $("win").hidden=true; };
/* Menu */
function syncSound(){
  const m=Snd.musicOn, f=Snd.sfxOn;
  $("bmusic").setAttribute("aria-pressed",m); $("bsfx").setAttribute("aria-pressed",f); $("bsfx").textContent=f?"🔊":"🔇";
  $("mMusic").setAttribute("aria-pressed",m); $("mMusic").querySelector("span").textContent=m?"Bật":"Tắt";
  $("mSfx").setAttribute("aria-pressed",f); $("mSfx").querySelector("span").textContent=f?"Bật":"Tắt";
}
const inProgress=()=> filled.size>0 && filled.size<A.length;
function openMenu(){
  stop(); const prog=inProgress();
  $("mStart").textContent = prog ? "Tiếp tục" : "Bắt đầu chơi";
  $("mRestart").hidden = !prog;
  $("win").hidden=true; $("menu").hidden=false; $("mStart").focus({preventScroll:true});
}
function restartGame(){ $("win").hidden=true; combo=0; filled.clear(); wrong=0; $("nno").textContent=0; $("banner").hidden=true; clearSel(); build(); resetTimer(); }
function launch(){
  Snd.ensure(); $("menu").hidden=true;
  if(filled.size===A.length) restartGame();
  window.scrollTo({top:0,behavior:"auto"});
  start();
}
document.querySelectorAll(".seg button").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-checked",x===btn));
  TIME=+btn.dataset.t; Snd.pick(); if(!inProgress()) resetTimer();
});
$("mMusic").onclick=()=>{ Snd.ensure(); Snd.toggleMusic(); syncSound(); Snd.pick(); };
$("mSfx").onclick=()=>{ Snd.toggleSfx(); syncSound(); Snd.pick(); };
$("mStart").onclick=launch;
$("mRestart").onclick=()=>{ restartGame(); launch(); };
$("bmenu").onclick=openMenu;
$("winmenu").onclick=()=>{ restartGame(); openMenu(); };
$("bhint").onclick=()=>{ const i=A.findIndex((_,k)=>!filled.has(k)); if(i<0) return; fill(i,"gv"); if(filled.size<A.length) say(TIP); };
$("ball").onclick=()=>{ clearSel(); let k=0; A.forEach((_,i)=>{ if(!filled.has(i)) setTimeout(()=>fill(i,"gv"),(k++)*220); }); };
$("breset").onclick=restartGame;
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!$("menu").hidden){ if(e.key==="Enter"&&e.target===document.body) launch(); return; }
  if(e.key===" " && !(e.target.closest&&e.target.closest("button,.chip,a"))){ e.preventDefault(); ticking?stop():start(); return; }
  if(e.key==="Escape"){ clearSel(); say(TIP); return; }
  if(/^[1-9]$/.test(e.key)) fill(+e.key-1,"gv");
});
build(); paint();
</script>
